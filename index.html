<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<title>Bit Agent — Fábrica de Jogos 2D</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#05080a;--panel:#0b1114;--line:#1b343d;--green:#39ff88;--cyan:#38d9ff;--amber:#ffbf4a;--red:#ff5d6c;--muted:#78919a;--text:#d9f5f7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10252b 0,#05080a 38%);color:var(--text);font:14px ui-monospace,SFMono-Regular,Consolas,monospace;height:100vh;overflow:hidden}button,textarea{font:inherit}button{background:#0c171b;border:1px solid var(--line);color:var(--text);padding:9px 12px;cursor:pointer}button:hover{border-color:var(--cyan);color:white}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(5,8,10,.92)}.brand{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;display:grid;place-items:center;background:var(--green);color:#031008;font-weight:900}.brand strong{color:var(--green);letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:2px}.status{color:var(--cyan);border:1px solid var(--line);padding:6px 9px}.main{min-height:0;display:grid;grid-template-columns:300px minmax(360px,1fr) 360px;gap:1px;background:var(--line)}.panel{background:var(--panel);min-width:0;min-height:0}.left,.right{padding:14px;overflow:auto}.center{display:grid;grid-template-rows:auto 1fr;min-width:0}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:3px 0 10px}.prompt{width:100%;min-height:130px;resize:vertical;background:#060b0d;color:var(--text);border:1px solid var(--line);padding:11px;outline:none}.prompt:focus,#code-editor:focus{border-color:var(--cyan)}.primary{width:100%;margin-top:8px;background:var(--green);color:#031008;border-color:var(--green);font-weight:800}.progress{height:5px;background:#071013;margin:12px 0}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .3s}.task{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:start;padding:9px 0;border-bottom:1px solid #102127}.task small{display:block;color:var(--muted);line-height:1.35;margin-top:3px}.task b{font-size:10px;color:var(--muted)}.task.done b{color:var(--green)}.task.error b{color:var(--red)}.task-dot{width:7px;height:7px;border:1px solid var(--muted);margin-top:4px}.task.done .task-dot{background:var(--green);border-color:var(--green)}.task.running .task-dot{background:var(--amber);border-color:var(--amber)}.task.error .task-dot{background:var(--red);border-color:var(--red)}.editorbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);gap:8px}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{padding:6px 9px;font-size:11px}.title{font-weight:700;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor{min-height:0}.editor textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:#030607;color:#bdfed0;padding:16px;line-height:1.5;tab-size:2}.preview{border:1px solid var(--line);background:#000;padding:8px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}.preview canvas{width:100%;height:100%;image-rendering:pixelated;background:#000}.validation{padding:9px;margin-top:10px;border:1px solid var(--line);font-size:11px}.validation.ok{color:var(--green);border-color:#174c31}.validation.error{color:var(--red);border-color:#55202a}.log{margin-top:12px;background:#030607;border:1px solid var(--line);height:170px;overflow:auto;padding:9px;color:#8eb1b8;font-size:11px;line-height:1.55}.hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:10px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:10px;padding:5px 7px}@media(max-width:1050px){.main{grid-template-columns:260px minmax(300px,1fr)}.right{display:none}}@media(max-width:720px){body{overflow:auto;height:auto;min-height:100vh}.app{height:auto;min-height:100vh}.main{display:flex;flex-direction:column}.left,.right{max-height:none}.center{height:560px}.top{position:sticky;top:0;z-index:5}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">B</div><div><strong>BIT AGENT</strong><small>fábrica de jogos 2D em português</small></div></div>
  <span class="status" id="agent-status">PRONTO</span>
</header>
<main class="main">
<section class="panel left">
  <div class="section-title">Objetivo do agente</div>
  <textarea id="agent-prompt" class="prompt" placeholder="Descreva o jogo que você quer criar..."></textarea>
  <button id="btn-generate" class="primary">Criar com o Agente</button>
  <div class="chips">
    <button id="btn-example" class="chip">Jogo de plataforma</button>
    <button class="chip" onclick="document.querySelector('#agent-prompt').value='Crie um Pong retro.'">Pong</button>
    <button class="chip" onclick="document.querySelector('#agent-prompt').value='Crie um jogo de nave e tiro.'">Shooter</button>
  </div>
  <div class="section-title" style="margin-top:20px">Plano de execução</div>
  <div class="progress"><div id="progress-bar"></div></div>
  <div id="task-list"></div>
</section>
<section class="panel center">
  <div class="editorbar"><span class="title" id="project-name">Novo projeto Bit</span><div class="tools"><button id="btn-validate">Validar</button><button id="btn-run">Executar</button><button id="btn-stop">Parar</button><button id="btn-save">Salvar</button><button id="btn-export">Exportar .bit</button></div></div>
  <div class="editor"><textarea id="code-editor" spellcheck="false"></textarea></div>
</section>
<section class="panel right">
  <div class="section-title">Preview do jogo</div>
  <div class="preview"><canvas id="game-canvas" width="640" height="360"></canvas></div>
  <div id="validation" class="validation">Aguardando validação.</div>
  <div class="section-title" style="margin-top:16px">Console do agente</div>
  <div id="agent-log" class="log"></div>
  <div class="hint">O agente planeja, gera e valida o código Bit antes de iniciar o runtime. O projeto é salvo localmente neste navegador.</div>
</section>
</main>
</div>
<script type="module" src="./src/agent-main.ts"></script>
</body>
</html>
