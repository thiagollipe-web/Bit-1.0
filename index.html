<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MicroConda Studio — Jogos 2D</title><meta name="description" content="MicroConda: ambiente educacional em português para criar jogos 2D no navegador."><meta name="theme-color" content="#0b1f14"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#06100a;--panel:#0b1a11;--panel2:#10251a;--line:#245238;--text:#d9ffe3;--muted:#76a88a;--accent:#42ff75;--danger:#ff5c5c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{min-height:58px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:9px;margin-right:auto}.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--accent);color:#001507;font-weight:900;border-radius:8px;box-shadow:0 0 18px #42ff7544}.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted)}button,input{font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:6px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#001507;border-color:var(--accent);font-weight:800}.btn.danger{color:var(--danger)}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,42%)}.editor,.preview{min-width:0;min-height:0}.editor{display:flex;flex-direction:column;border-right:1px solid var(--line)}.bar{padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar span{color:var(--muted);font-size:12px}#code-editor{flex:1;width:100%;resize:none;border:0;outline:0;background:#030805;color:var(--accent);padding:14px;font-size:14px;line-height:1.55;tab-size:2}.preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;background:#07110b;overflow:auto}.screen{width:min(100%,480px);aspect-ratio:4/3;background:#000;border:2px solid var(--line);border-radius:8px;overflow:hidden;position:relative}.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.screen button{position:absolute;right:8px;top:8px}.console{width:min(100%,480px);height:120px;overflow:auto;background:#030805;border:1px solid var(--line);padding:8px;color:var(--muted);font-size:12px}.status{width:min(100%,480px);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:10}.modal.hidden{display:none}.card{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.card h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.example{padding:12px;text-align:left}.muted{color:var(--muted)}pre{white-space:pre-wrap;background:#030805;padding:10px;border-radius:6px}@media(max-width:800px){.workspace{grid-template-columns:1fr;grid-template-rows:55% 45%}.editor{border-right:0;border-bottom:1px solid var(--line)}.top{overflow:auto}.brand{min-width:210px}.btn{padding:7px 9px;font-size:12px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">MC</div><div><h1>MicroConda Studio</h1><small>Criação de jogos 2D em português</small></div></div><button class="btn" id="new">Novo</button><button class="btn" id="save">Salvar .micro</button><button class="btn" id="open">Abrir .micro</button><input id="file" type="file" accept=".micro,.txt" hidden><button class="btn" id="library">Biblioteca</button><button class="btn" id="ai">MicroConda AI</button><button class="btn primary" id="run">▶ Executar</button><button class="btn danger" id="stop">■ Parar</button></header>
<main class="workspace"><section class="editor"><div class="bar"><strong id="title">Meu Projeto</strong><span id="saveState">Salvo</span><span id="cursor">Linha 1, Coluna 1</span></div><textarea id="code-editor" spellcheck="false"></textarea></section><section class="preview"><div class="screen"><canvas id="game-canvas" width="160" height="120"></canvas><button class="btn" id="fullscreen">Tela cheia</button></div><div class="status"><span id="engine">MicroConda Runtime pronto</span><span>Mobile/PWA</span></div><div class="console" id="console">Console MicroConda pronto.</div></section></main></div>
<div class="modal hidden" id="modal"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><h2 id="modalTitle">MicroConda</h2><button class="btn" id="close">Fechar</button></div><div id="modalBody"></div></div></div>
<script type="module" src="/src/main.ts"></script></body></html>
